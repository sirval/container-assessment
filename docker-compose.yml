services:
  mongodb:
    image: mongo:7
    container_name: muchtodo-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: much_todo_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - muchtodo-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "-u", "root", "-p", "example", "--authenticationDatabase", "admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: muchtodo-backend:latest
    container_name: muchtodo-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      MONGO_URI: "mongodb://root:example@mongodb:27017/much_todo_db?authSource=admin"
      DB_NAME: "much_todo_db"
      JWT_SECRET_KEY: "9f9d2f0c2f8d47d9b681b1c0a44f1b5f-local-assessment-secret"
      JWT_EXPIRATION_HOURS: "72"
      ENABLE_CACHE: "false"
      LOG_LEVEL: "DEBUG"
      LOG_FORMAT: "json"
      INTEGRATION: "true"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - muchtodo-network

volumes:
  mongodb_data:

networks:
  muchtodo-network:
    driver: bridge